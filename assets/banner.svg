
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Felipe Amaya - Full Stack, IA y Machine Learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#111827"/>
      <stop offset="1" stop-color="#2A1B04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F59E0B" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .fade{opacity:0;animation:fade 0.6s ease forwards}
    .d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}.d4{animation-delay:2.1s}.d5{animation-delay:2.7s}
    @keyframes fade{to{opacity:1}}
    .line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.2s .4s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-6px)}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <circle cx="1130" cy="40" r="120" fill="none" stroke="#F59E0B" stroke-opacity="0.12"/>
    <circle cx="1130" cy="40" r="170" fill="none" stroke="#F59E0B" stroke-opacity="0.07"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#F59E0B" stroke-opacity="0.25"/>

  <!-- Texto principal -->
  <g class="sans">
    <text x="60" y="64" class="mono fade d1" font-size="15" fill="#F59E0B" letter-spacing="3">&lt;/&gt; DESARROLLADOR FULL STACK</text>
    <text x="60" y="138" class="fade d1" font-size="68" font-weight="800" fill="#FFFFFF">Felipe Amaya</text>
    <rect class="line" x="62" y="154" width="300" height="5" rx="2.5" fill="url(#amber)" style="stroke:none;stroke-dasharray:none;animation:none"/>
    <text x="60" y="200" class="fade d2" font-size="26" font-weight="600" fill="url(#amber)">IA &amp; Machine Learning · ERP / POS · APIs REST</text>
  </g>
  <text x="60" y="246" class="mono fade d3" font-size="16" fill="#9CA3AF">&gt; Ingeniería de Sistemas · UTS · Bucaramanga, Colombia</text>
  <text x="60" y="276" class="mono fade d4" font-size="16" fill="#9CA3AF">&gt; Python · Flask · React · Node.js · PostgreSQL<tspan class="cursor" fill="#F59E0B"> ▌</tspan></text>

  <!-- Ventana de terminal -->
  <g class="float">
    <rect x="720" y="52" width="420" height="216" rx="14" fill="#0B0F17" stroke="#F59E0B" stroke-opacity="0.35"/>
    <rect x="720" y="52" width="420" height="36" rx="14" fill="#161B26"/>
    <rect x="720" y="74" width="420" height="14" fill="#161B26"/>
    <circle cx="745" cy="70" r="6" fill="#EF4444"/>
    <circle cx="767" cy="70" r="6" fill="#F59E0B"/>
    <circle cx="789" cy="70" r="6" fill="#22C55E"/>
    <text x="930" y="75" class="mono" font-size="12" fill="#6B7280">api · rest</text>

    <g class="mono" font-size="15">
      <text x="742" y="124" class="fade d2" fill="#E5E7EB"><tspan fill="#F59E0B">GET</tspan>  /api/facturas</text>
      <text x="742" y="148" class="fade d3" fill="#22C55E">200 OK <tspan fill="#6B7280">{ "data": [...] }</tspan></text>
      <text x="742" y="188" class="fade d4" fill="#E5E7EB"><tspan fill="#F59E0B">POST</tspan> /api/auth/login</text>
      <text x="742" y="212" class="fade d5" fill="#22C55E">201 Created <tspan fill="#6B7280">{ "token": "jwt..." }</tspan></text>
      <text x="742" y="248" class="fade d5" fill="#6B7280">$<tspan class="cursor" fill="#F59E0B"> ▌</tspan></text>
    </g>
  </g>
</svg>
