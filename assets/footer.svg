<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Contacto y cierre del perfil de Felipe Amaya" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1B04"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F59E0B" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="20"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .fade{opacity:0;animation:fade .7s ease forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}.d5{animation-delay:1.4s}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="20" fill="none" stroke="#F59E0B" stroke-opacity="0.25"/>
  <rect x="100" y="24" width="1000" height="3" rx="1.5" fill="url(#line)"/>

  <!-- Titulo -->
  <text x="600" y="68" text-anchor="middle" class="sans fade d1" font-size="28" font-weight="700" fill="#FFFFFF">¿Construimos algo juntos?</text>
  <text x="600" y="96" text-anchor="middle" class="mono fade d1" font-size="14" fill="#9CA3AF">Desarrollo web · APIs REST · ERP/POS · IA aplicada</text>

  <!-- Tarjetas de contacto -->
  <g class="sans">
    <!-- Correo -->
    <g class="fade d2">
      <rect x="40" y="120" width="265" height="62" rx="14" fill="#0B0F17" stroke="#F59E0B" stroke-opacity="0.4"/>
      <circle cx="76" cy="151" r="19" fill="#F59E0B" fill-opacity="0.15"/>
      <rect x="64" y="144" width="24" height="16" rx="2.5" fill="none" stroke="#F59E0B" stroke-width="1.8"/>
      <path d="M64.5 145.5 L76 154 L87.5 145.5" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="106" y="146" font-size="11" fill="#9CA3AF" class="mono">CORREO</text>
      <text x="106" y="167" font-size="12" fill="#E5E7EB" class="mono">felipeamaya0612@gmail.com</text>
    </g>
    <!-- WhatsApp -->
    <g class="fade d3">
      <rect x="325" y="120" width="265" height="62" rx="14" fill="#0B0F17" stroke="#F59E0B" stroke-opacity="0.4"/>
      <circle cx="361" cy="151" r="19" fill="#25D366" fill-opacity="0.18"/>
      <path d="M361 140.5 a10.5 10.5 0 1 1 -5.2 19.6 L351.5 162 L353 157.7 A10.5 10.5 0 0 1 361 140.5 Z" fill="none" stroke="#25D366" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M357.3 146.8 q-0.8 3.6 3.2 7.6 q3.6 3.2 6.2 2.2 l0.4-2.4 -2.6-1.4 -1.2 1.1 q-1.9-0.9-3-2.7 l1-1.1 -1.2-2.5 z" fill="#25D366"/>
      <text x="391" y="146" font-size="11" fill="#9CA3AF" class="mono">WHATSAPP</text>
      <text x="391" y="167" font-size="12" fill="#E5E7EB" class="mono">+57 317 390 5848</text>
    </g>
    <!-- LinkedIn -->
    <g class="fade d4">
      <rect x="610" y="120" width="265" height="62" rx="14" fill="#0B0F17" stroke="#F59E0B" stroke-opacity="0.4"/>
      <circle cx="646" cy="151" r="19" fill="#0A66C2" fill-opacity="0.25"/>
      <text x="646" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#60A5FA">in</text>
      <text x="676" y="146" font-size="11" fill="#9CA3AF" class="mono">LINKEDIN</text>
      <text x="676" y="167" font-size="12" fill="#E5E7EB" class="mono">/in/felipe-amaya</text>
    </g>
    <!-- Instagram -->
    <g class="fade d5">
      <rect x="895" y="120" width="265" height="62" rx="14" fill="#0B0F17" stroke="#F59E0B" stroke-opacity="0.4"/>
      <circle cx="931" cy="151" r="19" fill="#E4405F" fill-opacity="0.2"/>
      <rect x="920" y="140" width="22" height="22" rx="6" fill="none" stroke="#F472B6" stroke-width="1.8"/>
      <circle cx="931" cy="151" r="5" fill="none" stroke="#F472B6" stroke-width="1.8"/>
      <circle cx="938" cy="144.5" r="1.4" fill="#F472B6"/>
      <text x="961" y="146" font-size="11" fill="#9CA3AF" class="mono">INSTAGRAM</text>
      <text x="961" y="167" font-size="12" fill="#E5E7EB" class="mono">@felipeamaya._._</text>
    </g>
  </g>

  <!-- Stack en una linea -->
  <text x="600" y="213" text-anchor="middle" class="mono fade d5" font-size="13" fill="#6B7280">Python · Flask · React · Vue · Node.js · PostgreSQL · Docker · AWS · Azure · Ollama · Hugging Face</text>

  <!-- Estado -->
  <g class="fade d5">
    <circle cx="412" cy="240" r="4" fill="#22C55E" class="pulse"/>
    <text x="424" y="244" class="mono" font-size="13" fill="#9CA3AF">Hecho con ☕ y código desde Bucaramanga, Colombia<tspan class="cursor" fill="#F59E0B"> ▌</tspan></text>
  </g>
</svg>
